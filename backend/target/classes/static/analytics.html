<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LindaKey Traffic Logs</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f6f8; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #2c3e50; }
        .btn-back { display: inline-block; background-color: #34495e; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-bottom: 20px; font-weight: bold; transition: 0.2s; }
        .btn-back:hover { background-color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95em; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; }
        code { background: #eee; padding: 4px 8px; border-radius: 4px; color: #8e44ad; font-family: monospace; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; font-size: 0.9em; text-align: center; display: inline-block; min-width: 50px; }
        .badge-success { background-color: #27ae60; }
        .badge-warning { background-color: #f39c12; }
        .badge-error { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/index.html" class="btn-back">← Back to API Keys</a>
        <h1>Gateway Traffic Analytics</h1>
        <p>Showing the most recent requests routed through LindaKey</p>
        
        <table>
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>Method</th>
                    <th>Endpoint</th>
                    <th>Status</th>
                    <th>Latency</th>
                    <th>Client IP</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr><td colspan="6">Loading traffic logs...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchLogs() {
            try {
                // Pointing directly to the URL verified in your screenshot
                const response = await fetch('/api/analytics/usage');
                if (!response.ok) throw new Error("Server returned " + response.status);
                
                const logs = await response.json();
                const tableBody = document.getElementById('logsTableBody');
                tableBody.innerHTML = ''; 

                if (logs.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6">No traffic recorded yet. Send some requests!</td></tr>';
                    return;
                }

                // Display logs
                logs.reverse().forEach((log, index) => {
                    const displayId = log.id || (logs.length - index);
                    let badgeClass = 'badge-success';
                    
                    if (log.status === 429) badgeClass = 'badge-warning'; 
                    else if (log.status >= 400 && log.status !== 429) badgeClass = 'badge-error'; 

                    const row = `
                        <tr>
                            <td>#${displayId}</td>
                            <td><strong>${log.method}</strong></td>
                            <td><code>${log.path}</code></td>
                            <td><span class="badge ${badgeClass}">${log.status}</span></td>
                            <td>${log.latency} ms</td>
                            <td>${log.ip}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Failed to load logs:", error);
                document.getElementById('logsTableBody').innerHTML = 
                    `<tr><td colspan="6" style="color:red;">Error fetching logs. Check console for details.</td></tr>`;
            }
        }

        window.onload = fetchLogs;
    </script>
</body>
</html>
