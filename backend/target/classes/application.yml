server:
  port: 8080

spring:
  application:
    name: lindakey-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/lindakey_db
    username: lindakey_admin
    password: lindakey_secure_password_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration